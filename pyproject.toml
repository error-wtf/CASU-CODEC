[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casu-codec"
version = "1.0.2"
description = "CASU (Codec for All Segmented Units): legacy-compatible segmented-state codec/container for MP4 and MP3"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "zstd>=1.5"]

[project.optional-dependencies]
libav = ["av>=14"]

[project.scripts]
casu = "casu.cli:main"
casu-converter = "casu_converter:main"
mpc = "casu.cli:main"
mpcasu = "mpcasu_player:main"
web-casu = "web_casu:main"

[tool.setuptools.packages.find]
include = ["casu*"]

[tool.setuptools]
py-modules = ["mpcasu_player", "mpcasu_backend", "mpcasu_native_backend", "mpcasu_playback", "web_casu", "casu_converter"]

[tool.setuptools.data-files]
"share/casu-codec/assets" = [
  "assets/casu_codec_logo.png",
  "assets/casu_codec_logo_header.png",
  "assets/casu_codec_icon.png",
  "assets/casu_converter_icon.png",
  "assets/mpcasu_player_icon.png",
  "assets/mpcasu_player_logo.png",
  "assets/mpcasu_player_logo_header.png",
  "assets/mpcasu_player_mockup.png",
]
"share/doc/casu-codec" = [
  "README.md",
  "CASU_FORMAT_SPECIFICATION.md",
  "ROADMAP_60_STEPS.md",
  "RELEASE_GATE_STATUS.json",
  "THIRD_PARTY_COMPONENTS.md",
  "SOURCE_PROVENANCE.md",
  "BUNDLED_CODEC_MATRIX.md",
]
"share/doc/casu-codec/THIRD_PARTY_LICENSES" = [
  "THIRD_PARTY_LICENSES/README.md",
]
"share/casu-codec/web" = [
  "web/index.html",
  "web/styles.css",
  "web/app.js",
  "web/casu-native.js",
  "web/native-smoke.html",
  "web/native-smoke.js",
  "web/README.md",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "media: exercises real FFmpeg-decoded media fixtures and may take longer",
]
