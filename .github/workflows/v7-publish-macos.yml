name: Publish verified V7 macOS artifacts
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
env:
  PRODUCT_VERSION: "7.8.0"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve validated build
        env:
          GH_TOKEN: ${{ github.token }}
        # v7.8: pick the latest successful v7-apple run instead of a hardcoded ID
        run: |
          RUN_ID=$(gh run list --workflow v7-apple.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "Downloading from run $RUN_ID"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name v7-apple-build --dir apple
      - name: Verify full codec package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('apple')
          with zipfile.ZipFile(root / 'MPCASU-macOS-${{ env.PRODUCT_VERSION }}.zip') as archive:
              names = archive.namelist()
              assert any('MPCASU.app/Contents/MacOS/MPCASU' in n for n in names)
              assert any('CASU-Converter.app/Contents/MacOS/CASU-Converter' in n for n in names)
              assert any(n == 'casu' or n.endswith('/casu') for n in names)
          assert (root / 'MPCASU-macOS-${{ env.PRODUCT_VERSION }}.dmg').stat().st_size > 1000000
          PY
          cd apple
          sha256sum -c MPCASU-macOS-${{ env.PRODUCT_VERSION }}.zip.sha256 -c MPCASU-macOS-${{ env.PRODUCT_VERSION }}.dmg.sha256 || {
            # Build-host paths in the checksums are normalized by basename.
            sed -E 's@  .*/@  @' MPCASU-macOS-${{ env.PRODUCT_VERSION }}.zip.sha256 MPCASU-macOS-${{ env.PRODUCT_VERSION }}.dmg.sha256 | sha256sum -c -
          }
      - name: Replace existing v${{ env.PRODUCT_VERSION }} macOS files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v${{ env.PRODUCT_VERSION }} apple/MPCASU-macOS-${{ env.PRODUCT_VERSION }}.zip apple/MPCASU-macOS-${{ env.PRODUCT_VERSION }}.dmg --repo "$GITHUB_REPOSITORY" --clobber
