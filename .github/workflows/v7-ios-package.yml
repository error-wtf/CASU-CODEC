name: V7 iOS package
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  PRODUCT_VERSION: "7.8.0"

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Package device and simulator
        working-directory: apple/ios
        run: |
          set -euo pipefail
          xcodegen generate
          mkdir -p ../../dist/ios
          xcodebuild archive -project MPCASU.xcodeproj -scheme MPCASU -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath ../../dist/ios/MPCASU-iOS-${{ env.PRODUCT_VERSION }}.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          xcodebuild build -project MPCASU.xcodeproj -scheme MPCASU -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ../../.v7-ios-simulator CODE_SIGNING_ALLOWED=NO
          app='../../dist/ios/MPCASU-iOS-${{ env.PRODUCT_VERSION }}.xcarchive/Products/Applications/MPCASU.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = ${{ env.PRODUCT_VERSION }}
          ditto -c -k --keepParent "$app" ../../dist/ios/MPCASU-iOS-Device-Unsigned-${{ env.PRODUCT_VERSION }}.zip
          ditto -c -k --keepParent ../../dist/ios/MPCASU-iOS-${{ env.PRODUCT_VERSION }}.xcarchive ../../dist/ios/MPCASU-iOS-Archive-${{ env.PRODUCT_VERSION }}.zip
          ditto -c -k --keepParent ../../.v7-ios-simulator/Build/Products/Debug-iphonesimulator/MPCASU.app ../../dist/ios/MPCASU-iOS-Simulator-${{ env.PRODUCT_VERSION }}.zip
          mkdir -p ../../dist/ios/Payload
          ditto "$app" ../../dist/ios/Payload/MPCASU.app
          cd ../../dist/ios
          ditto -c -k --keepParent Payload MPCASU-iOS-${{ env.PRODUCT_VERSION }}.ipa
      - name: Verify MP3 tags and artwork
        working-directory: apple/ios
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | last.udid')"
          xcodebuild test -project MPCASU.xcodeproj -scheme MPCASU -destination "platform=iOS Simulator,id=$device" -only-testing:MPCASUTests/MediaMetadataTests -only-testing:MPCASUTests/IPTVTests CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: v7-ios-package
          path: |
            dist/ios/*.zip
            dist/ios/*.ipa
          if-no-files-found: error
      - name: Replace v7 iOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v${{ env.PRODUCT_VERSION }} dist/ios/*.zip dist/ios/*.ipa --clobber
