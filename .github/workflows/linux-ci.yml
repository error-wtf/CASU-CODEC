# Linux-CI: Die 647-Test-Suite (non-media) + deterministischer Deb-Build auf jedem
# Push/PR — vorher lief der Kern-Codec (Gates 1–3) ohne jegliche Push-Abdeckung.
name: Linux CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            pytest PySide6 python-vlc numpy zstd
      - name: Install Qt offscreen runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 xvfb ffmpeg
      - name: Run non-media test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m 'not media'

  debian-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build debs (reproducible)
        run: ./packaging/build_debs.sh
      - name: Smoke-check built packages
        run: |
          set -euo pipefail
          ls dist/*.deb
          for deb in dist/*.deb; do
            dpkg-deb -I "$deb" | grep -E 'Package|Version'
            dpkg-deb -c "$deb" >/dev/null
          done
          test -s dist/SHA256SUMS
