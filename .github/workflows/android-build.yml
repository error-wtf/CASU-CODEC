# Android-CI: assembleDebug des nativen libVLC-Players auf jedem Push/PR.
# JDK 21 (nicht 25 — AGP/Gradle-8.13-Kompatibilität), ANDROID_HOME über
# android-actions/setup-android; NDK/CMake installiert AGP selbst.
name: Android Build CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept SDK component licenses
        run: |
          # ubuntu-latest ships the Android SDK; accept all licenses up front
          # (setup-android@v3 dies on the interactive XR-preview prompt).
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Assemble debug APK
        working-directory: android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" && test -d "$ANDROID_HOME"
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain --no-daemon
      - name: Smoke-check APK output
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -E 'classes\.dex|lib/.+\.so' | head -20
