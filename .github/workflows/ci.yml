name: CASU validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Run unit and media-integrity tests
        run: pytest -q
      - name: Validate bundled manifests
        run: |
          casu validate test_media/lino_lol_test_pattern.casu --verify-source
          casu validate test_media/lino_casu_error.casu --verify-source
