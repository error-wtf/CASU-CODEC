<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;overflow:hidden;width:100%;height:100%;
    background:radial-gradient(circle at center,#1a0e12 0,#050608 70%)}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="viz"></canvas>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
const canvas=document.getElementById("viz"), ctx=canvas.getContext("2d");
let bands=new Uint8Array(128), wave=new Uint8Array(256), coverImg=null;
function resize(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight}
addEventListener("resize",resize);resize();
// ==== EXACT web-casu drawViz (web/app.js) — only the data source differs ====
function drawViz(){
  requestAnimationFrame(drawViz);
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  if(coverImg){
    const s=Math.min(w,h)*0.44;
    ctx.drawImage(coverImg,(w-s)/2,(h-s)/2,s,s);
  }
  const bufferLength=128, barW=w/bufferLength, gap=1;
  for(let i=0;i<bufferLength;i++){
    const barH=bands[i]/255*h*0.7, x=i*barW;
    ctx.fillStyle=i%2===0?"#ff1e2d":"#3a1015";
    ctx.fillRect(x+gap,h-barH,barW-gap*2,barH);
  }
  const fftSize=256;
  ctx.beginPath();
  ctx.strokeStyle="#ff1e2d88";ctx.lineWidth=2;
  for(let i=0;i<fftSize;i++){
    const x=i/fftSize*w, y=wave[i]/128*h*0.5+h*0.25;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke();
}
requestAnimationFrame(drawViz);
// dataReady from the Qt player: bands 0..255, wave 0..255 (like the analyser)
new QWebChannel(qt.webChannelTransport, channel=>{
  const viz=channel.objects.viz;
  viz.dataReady.connect((b,w)=>{ bands=Uint8Array.from(b); wave=Uint8Array.from(w); });
  viz.coverReady.connect(url=>{ coverImg=new Image(); coverImg.src=url; });
});
</script>
</body>
</html>
